parameters_model:
  m11: 12.0 
  m22: 24.0 
  m33: 3.0
  d11: 6.0
  d22: 8.0
  d33: 0.6
  aa: 0.45
  bb: 0.9
  max_force_limit: 6
  u_ref: 0.6 #0.3
  ego_length: 0.9
  ego_width: 0.45

parameters_mpc:
  nx: 7                  
  nu: 4                   
  Tf: 4
  Nhor: 40
  dt: 0.1
  Qye: 20.0
  Qr: 0.1
  Qpsi: 10.0
  Qu: 200
  num_obstacles: 6       # matches n_obs the trained anmpc_alpha/barriernet models expect
  dummy_x: 1000.0
  dummy_y: 1000.0
  dummy_radius: 0.1
  cbf_type: combo_chocbf_dcbf
  adaptive: true
  solver: fatrop


# parameters_scenario:
#   num_obs: 2
#   obstacle_x: [3.0, 6.0]
#   obstacle_y: [3.2, 3.2]
#   obstacle_theta: [-0.77, 0.77]
#   obstacle_a: [0.8, 0.8]
#   obstacle_b: [0.5, 0.5]

parameters_alpha:
  alpha1_min: 0.3
  alpha1_max: 0.3
  alpha2_min: 0.3
  alpha2_max: 0.3
  update_rate: 10.0   # Hz, how often alpha_node resamples and republishes

path:
  type: sine
  x_multiplier: 0.2
  y_offset: 3.0 #0.0
  slope: 0.0
  intercept: 0.0

parameters_amortized_mpc:
  model_file: model.eqx
  meta_file: model_meta.yaml
  # Optional per-field [lo, hi] pairs from the training config, used only to
  # warn at startup if kx/y0/u_ref fall outside them. Leave empty to skip.
  trained_ranges: {
    "kx":    [0.10, 0.30],
    "y0":    [2.5,  3.5],
    "u_ref": [0.40, 0.70],
    "r_obs": [0.4,  0.8],
  }

parameters_barriernet:
  model_file: model.eqx
  meta_file: model_meta.yaml
  # Same task/data/plant as parameters_amortized_mpc, so the same trained ranges apply.
  trained_ranges: {
    "kx":    [0.10, 0.30],
    "y0":    [2.5,  3.5],
    "u_ref": [0.40, 0.70],
    "r_obs": [0.4,  0.8],
  }